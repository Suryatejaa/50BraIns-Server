# Root Railway Configuration for Git-based Deployment  
# Uses Railway's optimized Railpack builder

[build]
# Let Railway auto-detect and use Railpack for Node.js

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "always"

[environments.production]
PORT = "$PORT"
JWT_SECRET = "$JWT_SECRET"